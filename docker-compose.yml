services:
  dindon:
    build: .
    depends_on:
      sandbox:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DINDON_DB: /data/dindon.sqlite
      DINDON_WORKSPACE: /workspace
      DINDON_SANDBOX_URL: http://sandbox:8787
      DINDON_LLM_BASE_URL: ${DINDON_LLM_BASE_URL:-http://host.docker.internal:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - dindon-data:/data
      - .:/workspace:ro
    networks:
      - default
      - sandbox
    stdin_open: true
    tty: true

  sandbox:
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      DINDON_SANDBOX_HOST: 0.0.0.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=1)"
      interval: 10s
      timeout: 2s
      retries: 3
    networks:
      - sandbox

volumes:
  dindon-data:

networks:
  default: {}
  sandbox:
    internal: true
